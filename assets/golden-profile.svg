<svg
  width="440"
  height="315"
  viewBox="0 0 440 315"
  xmlns="http://www.w3.org/2000/svg"
>
  <g
    fill="none"
    stroke="#ffffff"
    stroke-width="1.5"
    stroke-linejoin="round"
    opacity="0.95"
  >

    <!-- Outer frame -->
    <rect x="8" y="8" width="424" height="299"/>

    <!-- Golden rectangle -->
    <rect x="8" y="28" width="424" height="262"/>

    <!-- Fibonacci construction -->
    <path d="
      M 270 28
      V 290

      M 270 180
      H 422

      M 352 180
      V 290

      M 352 243
      H 422

      M 390 243
      V 290

      M 390 273
      H 422

      M 409 273
      V 290
    "/>

    <!-- Golden spiral -->
    <path d="
      M 8 28
      A 262 262 0 0 1 270 290

      M 270 290
      A 162 162 0 0 1 432 128

      M 432 128
      A 100 100 0 0 1 332 28

      M 332 28
      A 62 62 0 0 1 270 90

      M 270 90
      A 38 38 0 0 1 308 128

      M 308 128
      A 24 24 0 0 1 284 152

      M 284 152
      A 15 15 0 0 1 299 167
    "/>

    <!-- Construction diagonals -->
    <path
      d="M 8 28 L 270 290
         M 270 28 L 432 128
         M 352 180 L 422 250"
      opacity="0.35"
    />

  </g>

  <!-- Technical labels -->
  <g
    fill="#ffffff"
    font-family="monospace"
    font-size="10"
    opacity="0.7"
  >
    <text x="20" y="22">GOLDEN RATIO</text>
    <text x="350" y="22">φ = 1.618</text>

    <text x="285" y="174">21</text>
    <text x="365" y="236">13</text>
    <text x="398" y="267">8</text>
    <text x="412" y="285">5</text>

    <text x="20" y="302">FIBONACCI / PROPORTION / BALANCE</text>
  </g>

  <!-- Phi marker -->
  <g
    fill="#ffffff"
    font-family="serif"
    font-size="18"
    opacity="0.9"
  >
    <text x="395" y="302">φ</text>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg"
     width="440"
     height="315"
     viewBox="0 0 440 315">

  <g fill="none"
     stroke="#ffffff"
     stroke-width="2"
     stroke-linecap="round"
     stroke-linejoin="round">

    <!-- True golden rectangle: 440 / 272 ≈ 1.618 -->
    <rect x="0" y="21.5" width="440" height="272"/>

    <!-- Fibonacci squares: 272, 168, 104, 64, 40, 24, 16, 8 -->
    <path d="
      M272 21.5 V293.5

      M272 189.5 H440

      M376 189.5 V293.5

      M376 253.5 H440

      M416 253.5 V293.5

      M416 277.5 H440

      M432 277.5 V293.5

      M432 285.5 H440
    "/>

    <!-- Golden spiral -->
    <path d="
      M272 293.5
      A272 272 0 0 1 0 21.5

      M0 21.5
      A168 168 0 0 1 168 189.5

      M168 189.5
      A104 104 0 0 1 272 85.5

      M272 85.5
      A64 64 0 0 1 336 149.5

      M336 149.5
      A40 40 0 0 1 296 189.5

      M296 189.5
      A24 24 0 0 1 320 213.5

      M320 213.5
      A16 16 0 0 1 304 229.5

      M304 229.5
      A8 8 0 0 1 312 237.5
    "/>

  </g>
</svg>
